[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: pruebas rapidas, sin base de datos
    integration: requieren PostgreSQL y la variable DB_NAME_TEST
    quality: reglas de calidad de datos
    acceptance: indicadores de la bodega frente a un calculo independiente
# holidays 0.x avisa al importarse que la 1.0 seguira SemVer y recomienda fijar la version; ya esta fijada en
# requirements.txt y TC-CAR-22 detecta cualquier cambio en los festivos
filterwarnings =
    ignore::Warning:holidays
