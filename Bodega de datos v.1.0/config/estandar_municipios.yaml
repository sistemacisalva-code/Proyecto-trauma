# Estandarizacion de los valores de ciudad / municipio del Excel historico (registro_trauma).
# Cada entrada agrupa las variantes de escritura observadas bajo un nombre oficial (DIVIPOLA/DANE, con tildes).
# Las variantes se escriben ya normalizadas: minusculas, sin tildes, sin signos y con un solo espacio entre palabras
# (la comparacion aplica esa misma normalizacion al valor del Excel, asi que mayusculas, tildes y espacios sobrantes
# no necesitan listarse).
#
# tipo:      municipio | departamento | sin_informacion
# confianza: alta (omitida) | media (probable) | baja (adivinanza, requiere confirmar)
# Las entradas con confianza media o baja salen marcadas en la salida para que se revisen antes de cargar.
#
# BORRADOR elaborado solo con nombres (no con datos de pacientes). Revisar las entradas con `nota`.

